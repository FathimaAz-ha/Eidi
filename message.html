<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Eid Message Card</title>
  <meta name="description" content="A personalized Eid message card." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="message-page">
  <div class="sky-glow" aria-hidden="true"></div>
  <div class="stars" aria-hidden="true"></div>

  <main class="message-card reveal">
    <p class="eyebrow">A Gifted Eid Message</p>
    <h1 id="messageTitle">Eid Mubarak</h1>
    <p id="messageRecipient" class="message-recipient"></p>

    <section class="wish-panel">
      <p id="messageWish" class="wish-line"></p>
      <p id="messageSender" class="wish-sender"></p>
    </section>

    <a href="index.html" class="love-btn">Share a message with your loved one</a>
  </main>

  <script src="message.js"></script>
</body>
</html>
